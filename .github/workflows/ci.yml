name: SourceSeal CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx tsc --noEmit --pretty false
      - run: npm run lint
      - run: npm test
      - run: python -m py_compile contracts/source_seal.py tests/direct/test_source_seal.py
